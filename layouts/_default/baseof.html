<!DOCTYPE html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}" dir="{{ or site.Language.Direction `ltr` }}" color-mode="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div id="pageContainer">
    <header>
      {{ partial "header.html" . }}
    </header>
    <main id="mainContent">
        {{ block "main" . }}
        {{ end }}
    </main>
    <footer>
      {{ partial "footer.html" . }}
    </footer>
  </div>
  {{ partial "iconBackground.html" . }}

  <script>
    feather.replace();
    setColorScheme(colorSchemeQueryList);
  </script>
</body>
</html>
