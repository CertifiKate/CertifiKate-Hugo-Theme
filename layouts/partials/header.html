<div class="container container-spaced">
    <div class="homeLink">
        <a id="homeLink" href="/">
            <div class="name">
                {{ .Site.Title}}
            </div>
        </a>
    </div>
    <nav class="menuLinks" aria-label="Primary">
    {{- range site.Menus.header }}
        <a href="{{.URL }}">
            <div class="icon" aria-hidden="true">
                {{ .Pre }}
            </div>
            <div class="name">
                {{.Name}}
            </div>
        </a>
    {{- end}}
    {{- range site.Menus.userheader }}
        <a target="_blank" rel="noopener noreferrer" href="{{.URL }}">
            <div class="icon" aria-hidden="true">
                {{ .Pre }}
            </div>
            <div class="name">
                {{.Name}}
                <span class="visuallyHidden">(opens in a new tab)</span>
            </div>
        </a>
    {{- end}}
    </nav>
</div>
